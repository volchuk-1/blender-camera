name: build
# Builds the iPhone app (unsigned .ipa for SideStore) and the Blender add-on zip,
# and publishes both as the "latest" release.
on:
  workflow_dispatch:
    inputs:
      tests:
        description: run the unit tests on a simulator first
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ["ios/**", "addon/**", "protocol/**", ".github/**"]

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Add-on zip
        run: |
          cd addon
          zip -qr ../blendcam_addon.zip blendcam -x "*/__pycache__/*" "*.pyc"
          cd ..
          unzip -l blendcam_addon.zip | tail -n 3

      - name: Generate Xcode project
        working-directory: ios
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Unit tests (simulator)
        if: ${{ github.event_name == 'push' || inputs.tests }}
        working-directory: ios
        run: |
          set -o pipefail
          SIM=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone 1[5-7][^(]*' | sed 's/ *$//')
          echo "Simulator: $SIM"
          xcodebuild test -project Blendcam.xcodeproj -scheme Blendcam \
            -destination "platform=iOS Simulator,name=$SIM" \
            CODE_SIGNING_ALLOWED=NO > test.log 2>&1 || { grep -E "error:|failed|Failing|XCTAssert" test.log | head -n 80; tail -n 40 test.log; exit 1; }
          grep -E "Test Case .*(passed|failed)|Executed|\*\* TEST" test.log | tail -n 60

      - name: Build (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project Blendcam.xcodeproj -scheme Blendcam -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || { grep -E "error:" build.log | head -n 60; tail -n 40 build.log; exit 1; }
          grep -E "warning:" build.log | sort -u | head -n 30 || true
          tail -n 3 build.log

      - name: Package .ipa (ad-hoc sign for SideStore)
        working-directory: ios
        run: |
          set -e
          APP=build/Build/Products/Release-iphoneos/Blendcam.app
          codesign --force --sign - "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry ../Blendcam.ipa Payload
          ls -la ../Blendcam.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: blendcam
          path: |
            Blendcam.ipa
            blendcam_addon.zip

      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest Blendcam.ipa blendcam_addon.zip \
            --title "Blendcam build ${{ github.run_number }}" \
            --notes "Commit ${{ github.sha }}. Install Blendcam.ipa with SideStore; install blendcam_addon.zip in Blender 4.5 (Edit > Preferences > Add-ons > Install from Disk)."
