name: Blendcam
options:
  bundleIdPrefix: com.volchuk
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Blendcam:
    type: application
    platform: iOS
    sources: [Blendcam]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.volchuk.blendcam
        INFOPLIST_KEY_CFBundleDisplayName: Blendcam
    info:
      path: Blendcam/Info.plist
      properties:
        CFBundleDisplayName: Blendcam
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationLandscapeRight]
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UIRequiredDeviceCapabilities: [arkit]
        CFBundleURLTypes:
          - CFBundleURLName: com.volchuk.blendcam
            CFBundleURLSchemes: [blendcam]
        NSCameraUsageDescription: "Камера потрібна, щоб відстежувати рух телефона (ARKit) і сканувати QR-код у Blender."
        NSLocalNetworkUsageDescription: "Blendcam надсилає рух телефона в Blender на вашому комп'ютері в домашній Wi‑Fi."
  BlendcamTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - BlendcamTests
      - Blendcam/Core
      - path: ../protocol/fixtures
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.volchuk.blendcam.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Blendcam:
    build:
      targets:
        Blendcam: all
    test:
      targets: [BlendcamTests]
